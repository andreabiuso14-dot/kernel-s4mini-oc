name: Build Kernel S4 Mini GT-I9195 OC (LineageOS 18.1)

on:
  push:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compila Kernel GT-I9195 + Crea ZIP TWRP
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Download sorgenti del kernel
        uses: actions/checkout@v4

      - name: 2. Setup ambiente e compilatore GCC 9 ARM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex \
            gcc-9-arm-linux-gnueabihf binutils-arm-linux-gnueabihf gcc-9 \
            git libncurses-dev libssl-dev perl python-is-python3 zip
          arm-linux-gnueabihf-gcc-9 --version

      - name: 3. Configurazione e Compilazione zImage
        run: |
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export KCFLAGS="-std=gnu89 -fcommon -Wno-error -Wno-implicit-function-declaration -Wno-attributes -Wno-attribute-alias -Wno-array-bounds -Wno-misleading-indentation -Wno-bool-operation -Wno-int-in-bool-context -Wno-format-truncation -Wno-sizeof-pointer-memaccess -Wno-stringop-truncation"
          export HOSTCFLAGS="-std=gnu89 -fcommon -Wno-error"
          export KAFLAGS="-Wa,--no-warn"

          make mrproper

          # Rimuove -Werror forzata dal Makefile principale e applica fix Linux 3.4
          sed -i 's/-Werror//g' Makefile
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i '1i CFLAGS_perf_trace_counters.o := -I$(src)' arch/arm/mach-msm/Makefile || true

          echo ">>> Lista dei defconfig disponibili nel repository:"
          find arch/arm/configs -type f | sed 's|arch/arm/configs/||' | sort

          # Cerca il defconfig specifico per GT-I9195 (serranoltexx / msm8930)
          DEFCONFIG=$(find arch/arm/configs -type f -name "*serranoltexx*" | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*serrano_eur_lte*" | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*serrano*lte*" | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*serrano*" | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*msm8930*" | sed 's|arch/arm/configs/||' | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "ERRORE CRITICO: Nessun defconfig trovato per S4 Mini o MSM8930!"
            exit 1
          fi

          echo ">>> Defconfig selezionato con successo: $DEFCONFIG"
          make -s CC=arm-linux-gnueabihf-gcc-9 HOSTCC=gcc-9 "$DEFCONFIG"

          echo ">>> Avvio compilazione del kernel su $(nproc) core CPU..."
          if ! make -j$(nproc) CC=arm-linux-gnueabihf-gcc-9 HOSTCC=gcc-9 zImage > build.log 2>&1; then
            echo "=================================================================="
            echo "   ERRORE DURANTE LA COMPILAZIONE DEL KERNEL!                     "
            echo "=================================================================="
            echo ">>> Righe esatte con 'error:' nel log:"
            grep -n -C 3 "error:" build.log | head -n 45
            echo "------------------------------------------------------------------"
            echo ">>> Contesto intorno a Error 1:"
            grep -n -B 10 -A 2 "Error 1" build.log | head -n 40
            exit 1
          fi

          echo "=== COMPILAZIONE COMPLETATA CON SUCCESSO! ==="
          ls -lh arch/arm/boot/zImage

      - name: 4. Creazione pacchetto ZIP flashabile per TWRP
        run: |
          git clone --depth=1 https://github.com "$HOME/AnyKernel3"
          cp arch/arm/boot/zImage "$HOME/AnyKernel3/"

          cat << 'EOF' > "$HOME/AnyKernel3/anykernel.sh"
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=S4 Mini GT-I9195 OC Kernel (LineageOS 18.1)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=serranoltexx
          device.name2=serrano3gxx
          device.name3=serrano_eur_lte
          device.name4=GT-I9195
          device.name5=
          supported.versions=11
          supported.patchlevels=
          '; }

          block=/dev/block/platform/msm_sdcc.1/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cd "$HOME/AnyKernel3"
          rm -rf .git README.md
          zip -r9 "$HOME/S4Mini-GT-I9195-LOS18-OC-TWRP.zip" *

      - name: 5. Upload Kernel ZIP e zImage su GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S4Mini-GT-I9195-LOS18-OC-Release
          path: |
            ~/S4Mini-GT-I9195-LOS18-OC-TWRP.zip
            arch/arm/boot/zImage
          if-no-files-found: error

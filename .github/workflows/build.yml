name: Build Kernel S4 Mini OC
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup e Compilazione
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bc bison build-essential flex libncurses-dev libssl-dev python-is-python3
          git clone --depth=1 -b lineage-19.1 https://github.com ~/tc
          export ARCH=arm SUBARCH=arm CROSS_COMPILE=~/tc/bin/arm-linux-androideabi-
          DEFCONFIG=$(find arch/arm/configs -type f -name "*serranoltexx*defconfig" -o -name "*serrano*lte*defconfig" | sed 's|arch/arm/configs/||' | head -n 1)
          make mrproper && make -s "$DEFCONFIG" && make -j$(nproc) zImage

      - uses: actions/upload-artifact@v4
        with:
          name: S4Mini-GT-I9195-LOS18-OC
          path: arch/arm/boot/zImage

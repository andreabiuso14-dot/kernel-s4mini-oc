name: Build Kernel S4 Mini OC
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ambiente e GCC 4.9 Ufficiale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev bison flex libssl-dev bc python-is-python3 curl tar
          mkdir -p ~/toolchain
          curl -sL "https://googlesource.com" | tar -xz -C ~/toolchain

      - name: Compila Kernel GT-I9195
        run: |
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=~/toolchain/bin/arm-linux-androideabi-
          make mrproper
          
          DEFCONFIG=$(find arch/arm/configs -type f -name "*serranoltexx*defconfig" | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*serrano*lte*defconfig" | sed 's|arch/arm/configs/||' | head -n 1)
          echo ">>> Uso defconfig: $DEFCONFIG"
          
          if [ -z "$DEFCONFIG" ]; then
            echo "ERRORE: Nessun defconfig trovato per GT-I9195!"
            exit 1
          fi

          make -s "$DEFCONFIG"
          if ! make -j$(nproc) zImage > build.log 2>&1; then
            echo "=== ERRORI DI COMPILAZIONE RILEVATI ==="
            grep -n -E "error:|fatal error:" build.log | head -n 30
            echo "=== DETTAGLIO ULTIMI LOG ==="
            tail -n 25 build.log
            exit 1
          fi
          echo "=== COMPILAZIONE COMPLETATA CON SUCCESSO ==="

      - uses: actions/upload-artifact@v4
        with:
          name: S4Mini-GT-I9195-LOS18-OC
          path: arch/arm/boot/zImage
          if-no-files-found: error

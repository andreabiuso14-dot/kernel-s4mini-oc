      - name: Compila Kernel GT-I9195
        run: |
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export KCFLAGS="-fcommon -Wno-error -Wno-attribute-alias -Wno-array-bounds"
          export HOSTCFLAGS="-fcommon -Wno-error"
          export KAFLAGS="-Wa,--no-warn"
          make mrproper
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i '1i CFLAGS_perf_trace_counters.o := -I$(src)' arch/arm/mach-msm/Makefile
          
          # Cerca prima il defconfig specifico per GT-I9195 (serranoltexx / eur_lte)
          DEFCONFIG=$(find arch/arm/configs -type f \( -name "*serranoltexx*defconfig" -o -name "*serrano_eur_lte*defconfig" \) | sed 's|arch/arm/configs/||' | head -n 1)
          [ -z "$DEFCONFIG" ] && DEFCONFIG=$(find arch/arm/configs -type f -name "*serrano*lte*defconfig" | sed 's|arch/arm/configs/||' | head -n 1)
          
          echo ">>> Uso defconfig per GT-I9195: $DEFCONFIG"
          make -s "$DEFCONFIG"
          
          if ! make -j$(nproc) zImage modules > build.log 2>&1; then
            echo "=== PRIMO ERRORE REALE ==="
            grep -n -B 8 -A 2 "Error 1" build.log | head -n 35
            exit 1
          fi
          
          # Raccoglie tutti i moduli .ko in una cartella pulita per l'upload
          mkdir -p out_modules
          find . -name "*.ko" -exec cp {} out_modules/ \;
          echo "=== COMPILAZIONE COMPLETATA CON SUCCESSO ==="

      - uses: actions/upload-artifact@v4
        with:
          name: S4Mini-GT-I9195-OC-Kernel
          path: |
            arch/arm/boot/zImage
            out_modules/*.ko
          if-no-files-found: warn

name: Build Kernel S4 Mini GT-I9195 OC (LineageOS 18.1)

on:
  push:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compila Kernel GT-I9195 + Crea ZIP TWRP
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Download sorgenti del kernel
        uses: actions/checkout@v4

      - name: 2. Setup ambiente e compilatore GCC 9 ARM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex \
            gcc-9-arm-linux-gnueabihf binutils-arm-linux-gnueabihf gcc-9 \
            git libncurses-dev libssl-dev perl python-is-python3 zip

          sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-9 /usr/bin/arm-linux-gnueabihf-gcc
          sudo ln -sf /usr/bin/gcc-9 /usr/bin/gcc

      - name: 3. Configurazione e Compilazione zImage
        run: |
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export KCFLAGS="-std=gnu89 -fcommon -Wno-error -Wno-implicit-function-declaration -Wno-attributes -Wno-attribute-alias -Wno-array-bounds -Wno-misleading-indentation -Wno-bool-operation -Wno-int-in-bool-context -Wno-format-truncation -Wno-sizeof-pointer-memaccess -Wno-stringop-truncation"
          export HOSTCFLAGS="-std=gnu89 -fcommon -Wno-error"
          export KAFLAGS="-Wa,--no-warn -Wa,-mimplicit-it=thumb"

          make mrproper

          # Fix GCC 9 / binutils
          sed -i 's/-Werror=/-Wno-error=/g' Makefile
          sed -i 's/ -Werror / /g' Makefile
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i '1i CFLAGS_perf_trace_counters.o := -I$(src)' arch/arm/mach-msm/Makefile || true
          sed -i '1i AFLAGS_aesbs-core.o := -Wa,-mimplicit-it=thumb' arch/arm/crypto/Makefile || true

          # Genera il .config per GT-I9195
          make -s VARIANT_DEFCONFIG=msm8930_serrano_eur_lte_defconfig SELINUX_DEFCONFIG=selinux_defconfig samsung_serrano_defconfig

          # Crea un file di supporto con tutti i simboli platform_device 8930 mancanti al linker
          cat << 'EOF' > arch/arm/mach-msm/fix_8930_stubs.c
          #include <linux/platform_device.h>

          #define DEFINE_8930_STUB(sym) \
            struct platform_device sym __attribute__((weak)) = { .name = #sym, .id = -1 }

          DEFINE_8930_STUB(msm8930_rpm_stat_device);
          DEFINE_8930_STUB(msm8930_rpm_master_stat_device);
          DEFINE_8930_STUB(msm8930_rtb_device);
          DEFINE_8930_STUB(msm_bus_8930_apps_fabric);
          DEFINE_8930_STUB(msm_bus_8930_sys_fabric);
          DEFINE_8930_STUB(msm_bus_8930_mm_fabric);
          DEFINE_8930_STUB(msm_bus_8930_sys_fpb);
          DEFINE_8930_STUB(msm_bus_8930_cpss_fpb);
          DEFINE_8930_STUB(msm8930_iommu_domain_device);
          DEFINE_8930_STUB(msm8930_cache_dump_device);
          DEFINE_8930_STUB(msm8930_pc_cntr);
          DEFINE_8930_STUB(msm8930_cpu_slp_status);
          EOF

          sed -i '1i obj-y += fix_8930_stubs.o' arch/arm/mach-msm/Makefile

          if ! make -j$(nproc) zImage > build.log 2>&1; then
            echo "=== ULTIMI ERRORI DEL LINKER / COMPILATORE ==="
            grep -n -E "error:|undefined reference|multiple definition" build.log | tail -n 30
            exit 1
          fi

          echo "=== COMPILAZIONE COMPLETATA CON SUCCESSO! ==="
          ls -lh arch/arm/boot/zImage

      - name: 4. Creazione pacchetto ZIP flashabile per TWRP
        run: |
          git clone --depth=1 https://github.com "$HOME/AnyKernel3"
          cp arch/arm/boot/zImage "$HOME/AnyKernel3/"

          cat << 'EOF' > "$HOME/AnyKernel3/anykernel.sh"
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=S4 Mini GT-I9195 OC Kernel 2GHz (LineageOS 18.1)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=serranoltexx
          device.name2=serrano3gxx
          device.name3=serrano_eur_lte
          device.name4=GT-I9195
          device.name5=
          supported.versions=11
          supported.patchlevels=
          '; }

          block=/dev/block/platform/msm_sdcc.1/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cd "$HOME/AnyKernel3"
          rm -rf .git README.md
          zip -r9 "$HOME/S4Mini-GT-I9195-LOS18-OC-2GHz-TWRP.zip" *

      - name: 5. Upload Kernel ZIP e zImage su GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S4Mini-GT-I9195-LOS18-OC-2GHz-Release
          path: |
            ~/S4Mini-GT-I9195-LOS18-OC-2GHz-TWRP.zip
            arch/arm/boot/zImage
          if-no-files-found: error
